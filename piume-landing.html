<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>공연기획피움 | 클래식공연</title>
<style>
  :root{
    --teal: #1E9C8B;
    --teal-dark: #168072;
    --teal-light-bg: #EFF6F4;
    --cream: #FAFAF8;
    --text-dark: #1F2A2E;
    --text-gray: #6B7680;
    --border: #E6EBEA;
    --card-bg: #FFFFFF;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family: "Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
    background: #E9EDEC;
    display:flex;
    justify-content:center;
    color: var(--text-dark);
    -webkit-tap-highlight-color: transparent;
  }

  .page{
    width:100%;
    max-width:430px;
    background:var(--cream);
    min-height:100vh;
    position:relative;
  }

  /* ---------- HERO ---------- */
  .hero{
    padding: 48px 28px 40px;
    text-align:center;
    background:var(--cream);
  }

  .logo-circle{
    width:104px;
    height:104px;
    border-radius:50%;
    background: linear-gradient(155deg, var(--teal) 0%, var(--teal-dark) 100%);
    margin:0 auto 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  .logo-circle .stripe{
    position:absolute;
    top:-10px; left:18px;
    width:34px; height:60px;
    background: rgba(255,255,255,0.18);
    transform: rotate(20deg);
  }
  .logo-circle .stripe.s2{
    left:38px;
    background: rgba(255,255,255,0.32);
  }

  .logo-circle .brand{
    position:relative;
    font-size:9px;
    font-weight:700;
    letter-spacing:1.5px;
    color:#fff;
    margin-top:6px;
  }
  .logo-circle .brand b{ font-weight:800; }

  h1.title{
    font-size:23px;
    font-weight:800;
    letter-spacing:-0.3px;
    margin-bottom:14px;
  }

  .sub1{
    font-size:14.5px;
    color: #444C4F;
    line-height:1.6;
    margin-bottom:2px;
  }
  .sub2{
    font-size:14.5px;
    color: #444C4F;
    line-height:1.6;
    margin-bottom:22px;
  }

  .insta-circle{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1.6px solid var(--text-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
  }
  .insta-circle svg{ width:20px; height:20px; }

  .account-name{
    font-size:13.5px;
    color: var(--text-gray);
    font-weight:500;
  }

  /* ---------- PAYMENT SECTION ---------- */
  .payment-section{
    background: var(--teal-light-bg);
    padding: 36px 22px 28px;
  }

  .section-heading{
    text-align:center;
    font-size:18.5px;
    font-weight:800;
    margin-bottom:22px;
    letter-spacing:-0.2px;
  }
  .section-heading .hl{ color: var(--teal); }

  .account-card{
    background: var(--card-bg);
    border-radius:18px;
    padding:22px 20px;
    margin-bottom:16px;
    box-shadow: 0 2px 10px rgba(20,40,38,0.06);
  }

  .bank-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }

  .bank-badge{
    width:34px; height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:800;
    flex-shrink:0;
  }
  .bank-badge.nh{
    background:#EFF6E3;
    color:#5C9A3C;
    border:1.4px solid #B9DC95;
  }
  .bank-badge.kakao{
    background:#FFE300;
    color:#3A1D1D;
    border-radius:9px;
    font-size:15px;
  }

  .bank-name{
    font-size:16.5px;
    font-weight:800;
  }

  .account-number-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }

  .account-number{
    font-size:18px;
    font-weight:800;
    letter-spacing:0.2px;
    word-break:keep-all;
  }

  .copy-btn{
    background: var(--teal);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 14px;
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    flex-shrink:0;
    transition: background 0.15s ease, transform 0.1s ease;
    font-family:inherit;
  }
  .copy-btn:active{ transform: scale(0.96); background: var(--teal-dark); }
  .copy-btn svg{ width:14px; height:14px; }

  .account-holder{
    font-size:13.5px;
    color: var(--text-gray);
    margin-bottom:4px;
  }

  /* ---------- COPY MODAL ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,30,29,0.42);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    transition: opacity 0.2s ease;
    z-index:50;
  }
  .modal-overlay.show{
    opacity:1;
    visibility:visible;
  }

  .modal-box{
    background:#fff;
    border-radius:20px;
    padding:34px 30px 28px;
    width:78%;
    max-width:280px;
    text-align:center;
    transform: scale(0.9) translateY(6px);
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 12px 32px rgba(20,40,38,0.18);
  }
  .modal-overlay.show .modal-box{
    transform: scale(1) translateY(0);
  }

  .modal-icon{
    width:52px; height:52px;
    border-radius:50%;
    background: var(--teal-light-bg);
    color: var(--teal);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 16px;
  }
  .modal-icon svg{ width:26px; height:26px; }

  .modal-title{
    font-size:15.5px;
    font-weight:800;
    color: var(--text-dark);
    margin-bottom:5px;
  }
  .modal-sub{
    font-size:13px;
    color: var(--text-gray);
    font-weight:500;
  }

  /* ---------- INSTAGRAM BUTTON ---------- */
  .insta-link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin: 26px 22px 0;
    padding:16px 20px;
    border:1.6px solid var(--teal);
    border-radius:999px;
    color: var(--text-dark);
    font-weight:800;
    font-size:15.5px;
    text-decoration:none;
    background:var(--cream);
    transition: background 0.15s ease;
  }
  .insta-link:active{ background: #E4F1EE; }
  .insta-link .ig-grad{ width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; }
  .insta-link svg.chev{ width:16px; height:16px; margin-left:2px; }

  footer{
    text-align:center;
    font-size:12px;
    color: #9AA3A1;
    padding: 28px 0 32px;
  }

  /* ---------- FADE-IN ANIMATION ---------- */
  @keyframes fadeInUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .logo-circle {
    animation: fadeInUp 0.55s cubic-bezier(0.22,1,0.36,1) 0.05s both;
  }
  h1.title {
    animation: fadeInUp 0.55s cubic-bezier(0.22,1,0.36,1) 0.2s both;
  }
  .sub1 {
    animation: fadeInUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.34s both;
  }
  .sub2 {
    animation: fadeInUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.44s both;
  }
  .insta-circle {
    animation: fadeInUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.54s both;
  }
  .account-name {
    animation: fadeInUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.6s both;
  }
  .payment-section {
    animation: fadeInUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.72s both;
  }
  .insta-link {
    animation: fadeInUp 0.55s cubic-bezier(0.22,1,0.36,1) 0.88s both;
  }
  footer {
    animation: fadeInUp 0.5s cubic-bezier(0.22,1,0.36,1) 0.98s both;
  }
</style>
</head>
<body>

<div class="page">

  <div class="hero">
    <div class="logo-circle">
      <div class="stripe"></div>
      <div class="stripe s2"></div>
      <div class="brand">PIUM <b>·</b> PLANNING</div>
    </div>

    <h1 class="title">공연기획피움 ㅣ 클래식공연</h1>
    <p class="sub1">예술가들의 꿈과 열정을 응원합니다 :)</p>
    <p class="sub2">티켓문의, 공연문의, 후원문의 DM 환영</p>

    <div class="insta-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.2" cy="6.8" r="1"/>
      </svg>
    </div>

    <p class="account-name">공연기획피움 / 대전 세종 공연기획</p>
  </div>

  <div class="payment-section">
    <h2 class="section-heading"><span class="hl">입금</span>을 원하시는 계좌를 선택해 주세요</h2>

    <div class="account-card">
      <div class="bank-row">
        <div class="bank-badge nh">NH</div>
        <div class="bank-name">농협은행</div>
      </div>
      <div class="account-number-row">
        <div class="account-number">301-0298-4340-21</div>
        <button class="copy-btn" data-account="301-0298-4340-21">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="11" height="11" rx="2"/>
            <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
          </svg>
          계좌번호 복사
        </button>
      </div>
      <div class="account-holder">예금주 : 공연기획피움</div>
    </div>

    <div class="account-card">
      <div class="bank-row">
        <div class="bank-badge kakao">B</div>
        <div class="bank-name">카카오뱅크</div>
      </div>
      <div class="account-number-row">
        <div class="account-number">3333-12-3456789</div>
        <button class="copy-btn" data-account="3333-12-3456789">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="11" height="11" rx="2"/>
            <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
          </svg>
          계좌번호 복사
        </button>
      </div>
      <div class="account-holder">예금주 : 공연기획피움</div>
    </div>
  </div>

  <div class="modal-overlay" id="copyModal">
    <div class="modal-box">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12.5l2.5 2.5L16 9.5"/>
        </svg>
      </div>
      <div class="modal-title">계좌번호가 복사되었습니다.</div>
      <div class="modal-sub" id="copiedAccountText">301-0298-4340-21</div>
    </div>
  </div>

  <a href="#" class="insta-link" id="instaLink">
    <svg viewBox="0 0 24 24" width="22" height="22">
      <defs>
        <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FEDA75"/>
          <stop offset="35%" stop-color="#FA7E1E"/>
          <stop offset="65%" stop-color="#D62976"/>
          <stop offset="100%" stop-color="#962FBF"/>
        </linearGradient>
      </defs>
      <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#igGrad)"/>
      <circle cx="12" cy="12" r="4.3" fill="none" stroke="#fff" stroke-width="1.7"/>
      <circle cx="17" cy="7" r="1.1" fill="#fff"/>
    </svg>
    인스타그램 바로가기
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
      <path d="M9 6l6 6-6 6"/>
    </svg>
  </a>

  <footer>© 공연기획피움. All rights reserved.</footer>

</div>

<script>
  const modal = document.getElementById('copyModal');
  const copiedAccountText = document.getElementById('copiedAccountText');
  let hideTimer;

  function openModal(account){
    copiedAccountText.textContent = account;
    modal.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(closeModal, 1800);
  }

  function closeModal(){
    modal.classList.remove('show');
  }

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const account = btn.dataset.account;

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(account);
        } else {
          const ta = document.createElement('textarea');
          ta.value = account;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
      } catch (e) {
        console.error('복사 실패:', e);
      }

      openModal(account);
    });
  });

  // 배경(오버레이) 탭하면 모달 즉시 닫기
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      clearTimeout(hideTimer);
      closeModal();
    }
  });

  document.getElementById('instaLink').addEventListener('click', (e) => {
    e.preventDefault();
    // 실제 인스타그램 계정 URL로 교체해 사용하세요
    window.open('https://www.instagram.com/piumplanning/', '_blank');
  });
</script>

</body>
</html>
